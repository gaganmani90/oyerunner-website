# Oye Runner training plan
# File name = plan ID (used in links, PDFs and the Goal Finder). Don't rename it unless asked.
# Weekly km, peak km and total km are worked out automatically from the "km" of each day.
# Day types: rest | easy | key (speed/tempo/race-pace) | long | race | strength
# Each week lists Monday to Sunday. Add "date:" to a day only for race plans with fixed dates.
title: 16-Week Beginner Marathon (run-walk)
subtitle: Only after you've finished a half marathon or run-walked 15 km. 3 walk-run days + strength.
level: beginner
distance: 42k
who_its_for: "Generic plan for a complete beginner who has never trained for running: healthy, can walk briskly for 30-40 minutes."
start_only_if: Must have finished a half marathon, or the Oye Runner 16-Week Beginner Half Marathon. Not for absolute beginners.
pdf_name: Oye Runner 16-Week Beginner Marathon run-walk
