        title: Rest
        details: Full rest. Walk, stretch, sleep 7-9 hours.
        km: 0
      - type: easy
        title: Easy run
        details: 6 km easy (walk breaks fine)
        km: 6
      - type: strength
        title: Strength
        details: "Strength A (30 min): squats 3x10, reverse lunges 3x8/leg, single-leg RDL 3x8/leg, calf raises 3x15, plank 3x40 s"
        km: 0
      - type: key
        title: Steady run
        details: 8 km incl. 3 km at marathon effort
        km: 8
