# Oye Runner training plan
# File name = plan ID (used in links, PDFs and the Goal Finder). Don't rename it unless asked.
# Weekly km, peak km and total km are worked out automatically from the "km" of each day.
# Day types: rest | easy | key (speed/tempo/race-pace) | long | race | strength
# Each week lists Monday to Sunday. Add "date:" to a day only for race plans with fixed dates.
title: Navy Half Marathon 2026 · 10K Race-Week Plan
subtitle: Race week 18-22 Nov + recovery week
event: navy-2026
distance: 10k
who_its_for: For runners entered in the IndianOil WNC Navy Half Marathon, Sunday 22 Nov 2026, South Mumbai.
start_only_if: "You're registered for the 10K and have trained for it. No new training this week: rest, sharpen, race."
pdf_name: Oye Runner Navy Half Marathon 2026 - 10K Race-Week Plan
