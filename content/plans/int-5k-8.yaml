# Oye Runner training plan
# File name = plan ID (used in links, PDFs and the Goal Finder). Don't rename it unless asked.
# Weekly km, peak km and total km are worked out automatically from the "km" of each day.
# Day types: rest | easy | key (speed/tempo/race-pace) | long | race | strength
# Each week lists Monday to Sunday. Add "date:" to a day only for race plans with fixed dates.
title: 5K Intermediate · 8-Week Plan
subtitle: 8 weeks · 4-5 run days + 2 strength
level: intermediate
distance: 5k
who_its_for: "Generic plan for a 32-year-old male intermediate runner: already running 3-4 days a week and able to run 10 km comfortably. 5K/10K plans use 4 run days, 21K uses 4, 42K uses 5, plus 2 strength sessions."
start_only_if: Comfortable running 20-25 km a week.
pdf_name: Oye Runner 5K Intermediate - 8-Week Plan
