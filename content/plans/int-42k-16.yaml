    days:
      - type: rest
        title: Rest
        details: Full rest. Walk, stretch, sleep 7-9 hours.
        km: 0
      - type: key
        title: Speed
        details: 6 x 1 km at 10K effort, 90 s jog. Warm-up 15 min easy + drills; cool-down 10 min easy.
        km: 10
      - type: easy
        title: Easy run + Strength A
        details: "6 km easy (Zone 2), then Strength A (30 min): squats 3x10, reverse lunges 3x8/leg, single-leg RDL 3x8/leg, calf raises 3x15, plank 3x40 s"
        km: 6
      - type: key
        title: Race-pace run
        details: 8 km incl. 4 km at marathon effort (RPE 6)
        km: 8
      - type: rest
        title: Rest
        details: Rest or 20 min mobility / yoga.
        km: 0
      - type: easy
        title: Easy + strides + Strength B
        details: "5 km easy + 6 x 20 s strides, then Strength B (30 min): glute bridges 3x12, step-ups 3x10/leg, side plank 3x30 s/side, single-leg calf raises 3x12, dead bugs 3x10"
        km: 5
      - type: long
        title: Long run
        details: 14 km easy (Zone 2, conversational)
        km: 14
