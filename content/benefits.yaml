# Oye Runner · "Six reasons to start" cards (Why run section)
# reel: paste an Instagram reel link to show a "Watch the reel" button on that card.
# ─────────────────────────────────────────────────────────────

- title: A stronger heart.
  text: Regular easy running lowers resting heart rate and blood pressure, and builds the aerobic engine for everything else.
  fact: 150 min of moderate activity a week is the WHO minimum
  reel: ""

- title: Healthy weight loss.
  text: Running burns more energy per minute than most activities. Paired with good food, it helps you lose fat and keep it off.
  fact: Roughly 1 kcal per kg of body weight per km
  reel: ""

- title: A calmer mind.
  text: Runs lift mood, cut stress and clear your head before a long workday. Many runners call it their daily therapy.
  fact: Even 20-30 min of easy running helps
  reel: ""

- title: Strong bones and joints.
  text: Done gradually, running strengthens bones, tendons and cartilage. Add strength work and your knees thank you.
  fact: Two strength sessions a week in every plan
  reel: ""

- title: Deeper sleep.
  text: Morning runs set your body clock, and steady training helps you fall asleep faster and wake fresher.
  fact: Aim for 7-9 hours on training weeks
  reel: ""

- title: Your running family.
  text: Group runs and race days turn a solo habit into friendships that keep you showing up, week after week.
  fact: Join Oye Runner's weekend runs
  reel: ""
