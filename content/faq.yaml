# Add, remove or reorder questions. They appear in this order.
# ─────────────────────────────────────────────────────────────

- q: I've never run. Which plan should I pick?
  a: Start with the 8-Week Couch-to-5K in the Beginner tab. It begins with one-minute jogs between walks, so your joints and tendons adapt safely. After that, move on to the beginner 10K or half marathon.

- q: What's the difference between free and paid plans?
  a: Free plans are generic, written for a typical runner of that level. A paid plan is built around your current fitness, pace, schedule, injuries and race date, and coaching subscriptions adjust it every week with check-ins.

- q: Do I need a smartwatch?
  a: No. Every plan uses a talk test and effort scale. A watch helps you track heart rate and pace, but your breathing is the best guide.

- q: How do I train through Indian summers and the monsoon?
  a: Run early, ideally before 7:30 am in summer, slow down on humid days and add electrolytes for runs over an hour. Swap to a treadmill or indoor strength on heavy-rain days.

- q: Will running help me lose weight?
  a: Yes, when paired with a modest calorie deficit and enough protein. Choose "Starting weight-loss journey" when you start with Oye Runner and Coach Mayank will share a plan with simple Indian meal swaps.

- q: Is it safe to start if I have a health condition?
  a: Check with your doctor first if you have a heart, lung, kidney or metabolic condition, get chest pain or dizziness during exercise, are pregnant, or are returning from injury.
